name: base-image

on:
  pull_request:
    paths:
      - images/base/**
      - .github/workflows/base-image.yml
  push:
    branches: [main]
    paths:
      - images/base/**
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base
  # 基础镜像的环境版本。升级 Python / Node 主版本时改这里，并同步修改 Dockerfile。
  TAG: py3.12-node24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 构建 runtime
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: runtime
          load: true
          tags: base-test:runtime
          cache-from: type=gha,scope=base-runtime
          cache-to: type=gha,scope=base-runtime,mode=max

      - name: 构建 build
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: build
          load: true
          tags: base-test:build
          cache-from: type=gha,scope=base-build
          cache-to: type=gha,scope=base-build,mode=max

      - name: 检查镜像内容
        run: images/base/test.sh base-test:runtime base-test:build

      - name: 漏洞扫描（runtime）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: base-test:runtime
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ''
          - target: build
            suffix: '-build'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # 滚动标签 py3.12-node24[-build]，外加不可变的 py3.12-node24[-build]-sha-<提交号>。
          tags: |
            type=raw,value=${{ env.TAG }}${{ matrix.suffix }}
            type=sha,prefix=${{ env.TAG }}${{ matrix.suffix }}-sha-

      - uses: docker/build-push-action@v7
        with:
          context: images/base
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-${{ matrix.target }}
          cache-to: type=gha,scope=base-${{ matrix.target }},mode=max
