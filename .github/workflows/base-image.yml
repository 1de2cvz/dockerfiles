name: base-image

on:
  pull_request:
    paths:
      - images/base/**
      - scripts/check_versions.py
      - .github/workflows/base-image.yml
  push:
    branches: [main]
    paths:
      - images/base/**
      - scripts/check_versions.py
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 核对 Dockerfile 与 versions.env
        run: python3 scripts/check_versions.py --offline

      - uses: docker/setup-buildx-action@v4

      - name: 构建 runtime
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: runtime
          load: true
          tags: base-test:runtime
          cache-from: type=gha,scope=base-runtime
          cache-to: type=gha,scope=base-runtime,mode=max

      - name: 构建 build
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: build
          load: true
          tags: base-test:build
          cache-from: type=gha,scope=base-build
          cache-to: type=gha,scope=base-build,mode=max

      - name: 构建 runtime-java
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: runtime-java
          load: true
          tags: base-test:runtime-java
          cache-from: type=gha,scope=base-runtime-java
          cache-to: type=gha,scope=base-runtime-java,mode=max

      - name: 构建 build-java
        uses: docker/build-push-action@v7
        with:
          context: images/base
          target: build-java
          load: true
          tags: base-test:build-java
          cache-from: type=gha,scope=base-build-java
          cache-to: type=gha,scope=base-build-java,mode=max

      - name: 检查镜像内容
        run: images/base/test.sh base-test:runtime base-test:build base-test:runtime-java base-test:build-java

      - name: 漏洞扫描（runtime）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: base-test:runtime
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: 漏洞扫描（runtime-java）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: base-test:runtime-java
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [runtime, build, runtime-java, build-java]
    steps:
      - uses: actions/checkout@v7

      # 标签由 versions.env 生成：
      #   runtime → py3.12-node24          build → py3.12-node24-build
      #   runtime-java → py3.12-node24-java8   build-java → py3.12-node24-java8-build
      - id: tag
        run: |
          . images/base/versions.env
          tag="py${PYTHON}-node${NODE}"
          case "${{ matrix.target }}" in
            runtime)      ;;
            build)        tag="${tag}-build" ;;
            runtime-java) tag="${tag}-java${JAVA}" ;;
            build-java)   tag="${tag}-java${JAVA}-build" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # 滚动标签，外加不可变的 <标签>-sha-<提交号>。
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,prefix=${{ steps.tag.outputs.tag }}-sha-

      - uses: docker/build-push-action@v7
        with:
          context: images/base
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-${{ matrix.target }}
          cache-to: type=gha,scope=base-${{ matrix.target }},mode=max
