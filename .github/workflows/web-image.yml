name: web-image

on:
  pull_request:
    paths:
      - images/web/**
      - scripts/check_versions.py
      - .github/workflows/web-image.yml
  push:
    branches: [main]
    paths:
      - images/web/**
      - scripts/check_versions.py
      - .github/workflows/web-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 核对 Dockerfile 与 versions.env
        run: python3 scripts/check_versions.py --offline

      - uses: docker/setup-buildx-action@v4

      - name: 构建
        uses: docker/build-push-action@v7
        with:
          context: images/web
          load: true
          tags: web-test:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: 检查镜像行为
        run: images/web/test.sh web-test:latest

      - name: 漏洞扫描
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: web-test:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # 标签由 versions.env 生成，如 nginx1.30。
      - id: tag
        run: |
          . images/web/versions.env
          echo "tag=nginx${NGINX}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,prefix=${{ steps.tag.outputs.tag }}-sha-

      - uses: docker/build-push-action@v7
        with:
          context: images/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
