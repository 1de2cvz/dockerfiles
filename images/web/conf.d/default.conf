# 单页应用（SPA）站点配置。页面文件在 /usr/share/nginx/html。
#   /assets/*    带哈希的构建产物（Vite 默认输出目录），长期缓存；不存在时返回 404
#   /config.js   运行时配置，由 WEB_PUBLIC_* 环境变量在启动时生成，不缓存
#   /healthz     健康检查
#   其他路径     找不到文件时回退到 index.html，交给前端路由
#
# 注意：location 里一旦写了 add_header，就不再继承 server 级的 add_header，
# 所以每个写了 add_header 的 location 都要再 include 一次安全响应头。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /tmp/web/config.js;
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
