# 安全响应头。默认只允许同源资源（与 STANDARD.md 5.6 一致：不引用外部 CDN）。
# 项目需要放宽 CSP 时，在自己的 Dockerfile 里覆盖本文件：
#   COPY security-headers.conf /etc/nginx/snippets/security-headers.conf
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
